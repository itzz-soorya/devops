<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Website</title>

    <style>
        body{
            margin:0;
            font-family: Arial, sans-serif;
            background:red;
        }

        header{
            background:#222;
            color:white;
            padding:20px;
            text-align:center;
        }

        nav{
            background:#444;
            padding:10px;
            text-align:center;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 15px;
            font-size:18px;
        }

        .container{
            padding:40px;
            text-align:center;
        }

        .card{
            background:white;
            padding:20px;
            width:300px;
            margin:auto;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        button{
            background:#007bff;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:5px;
            cursor:pointer;
            margin-top:15px;
        }

        button:hover{
            background:#0056b3;
        }

        footer{
            background:#222;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:40px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to devops project</h1>
        <p>Simple HTML + CSS Sample</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Hello User 👋</h2>
            <p>This is a sample webpage using HTML and CSS.</p>

            <button>Click Me</button>
        </div>
    </div>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
